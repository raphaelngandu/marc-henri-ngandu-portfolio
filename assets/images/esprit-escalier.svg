<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" width="800" height="1100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10"/>
      <stop offset="40%" stop-color="#141824"/>
      <stop offset="100%" stop-color="#05070a"/>
    </linearGradient>
    <linearGradient id="stairs" x1="0%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#3b4252" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#10131a" stop-opacity="0.1"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#4c566a" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <rect width="800" height="1100" fill="url(#bg)"/>
  <rect width="800" height="1100" fill="url(#glow)"/>
  
  <!-- Architectural silhouette / staircase abstract art -->
  <g opacity="0.35">
    <polygon points="100,200 700,200 650,280 150,280" fill="url(#stairs)"/>
    <polygon points="150,300 650,300 600,380 200,380" fill="url(#stairs)"/>
    <polygon points="200,400 600,400 550,480 250,480" fill="url(#stairs)"/>
    <polygon points="250,500 550,500 500,580 300,580" fill="url(#stairs)"/>
    <polygon points="300,600 500,600 460,680 340,680" fill="url(#stairs)"/>
    <line x1="400" y1="150" x2="400" y2="720" stroke="#d8dee9" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.5"/>
  </g>
  
  <!-- Subtle Grain and Shadows -->
  <circle cx="400" cy="420" r="140" fill="#2e3440" opacity="0.25"/>
  
  <!-- Poster Typography -->
  <text x="400" y="110" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#a0a8b7" letter-spacing="8" text-anchor="middle">SOURIRE PRODUCTIONS &amp; DECINE LARIO PRÉSENTENT</text>
  
  <text x="400" y="750" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#8892b0" letter-spacing="6" text-anchor="middle">AVEC MARC-HENRI NGANDU DANS LE RÔLE D'OSCAR</text>
  
  <text x="400" y="830" font-family="Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="4" text-anchor="middle">L'ESPRIT DE L'ESCALIER</text>
  
  <text x="400" y="870" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#d8dee9" letter-spacing="5" text-anchor="middle">UN FILM PSYCHOLOGIQUE</text>
  
  <rect x="360" y="900" width="80" height="2" fill="#8892b0" opacity="0.6"/>
  
  <text x="400" y="940" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#717c91" letter-spacing="3" text-anchor="middle">POST-PRODUCTION • COURT-MÉTRAGE</text>
  <text x="400" y="970" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#586377" letter-spacing="2" text-anchor="middle">SÉLECTION EN FESTIVALS 2025</text>
</svg>